# Phase A (local / pre-TLS): HTTP reverse proxy in front of the compose stack.
# nginx is the only container that publishes a port; it routes by request path
# to the frontend and backend services, resolved by name on the compose network.
#
# Phase B adds an HTTP->HTTPS redirect + a `listen 443 ssl` server block (with a
# Cloudflare Origin cert) and the security headers, once a domain exists.

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:5000;
}

server {
    listen 80;
    server_name _;

    # Next.js build assets are content-hashed -> safe to cache for a year.
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }

    # API -> backend. Forward the real client details so rate-limiting and
    # logging see the visitor, not nginx (Express uses `trust proxy`).
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Next.js frontend.
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
