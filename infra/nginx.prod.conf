# Reverse proxy in front of the compose stack, behind Cloudflare.
#   browser <-> Cloudflare : Universal SSL (Cloudflare-managed)
#   Cloudflare <-> origin  : the Origin Certificate below (SSL mode Full (Strict))
# nginx is the only container that publishes ports; it routes by request path to
# the frontend and backend services (resolved by name on the compose network).

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:5000;
}

# Don't leak the nginx version in responses/error pages.
server_tokens off;

# HTTP -> redirect everything to HTTPS (covers direct-to-IP access; Cloudflare
# reaches the origin over 443 in Full (Strict)).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS with the Cloudflare Origin Certificate.
server {
    listen 443 ssl;
    http2 on;
    server_name ogulcantekines.com www.ogulcantekines.com;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Next.js build assets are content-hashed -> safe to cache for a year.
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }

    # API -> backend. Forward the real client details so rate-limiting and
    # logging see the visitor, not nginx (Express uses `trust proxy`).
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> Next.js frontend.
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
