# Production stack: nginx (the single public door) in front of the frontend and
# backend, both talking to postgres. Only nginx publishes a port; db/backend/
# frontend are reachable ONLY on the internal compose network, by service name
# (Docker's embedded DNS resolves "db", "backend", "frontend" to container IPs).
#
# Secrets come from a local .env.prod file (see .env.prod.example) — never
# commit that file. Bring the whole stack up with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  # --- PostgreSQL -----------------------------------------------------------
  # No published ports: nothing outside the compose network can reach it. The
  # volume keeps data alive across container recreation.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "started" != "ready" — this lets backend wait until psql accepts conns.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Backend (Express + Prisma) ------------------------------------------
  # Built from its own Dockerfile. Reaches postgres at host "db" (internal DNS),
  # NOT localhost. Runs `prisma migrate deploy` on start, so it must wait until
  # the DB is healthy. Not published — only nginx talks to it.
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy

  # --- Frontend (Next.js standalone) ---------------------------------------
  # NEXT_PUBLIC_API_URL is baked into the browser bundle at BUILD time -> passed
  # as a build arg. Left empty so the browser calls same-origin /api/* (nginx
  # proxies it) — no CORS, backend stays private.
  # API_URL is read at RUNTIME by the Next server for SSR fetches -> internal DNS.
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    environment:
      API_URL: http://backend:5000
    depends_on:
      - backend

  # --- nginx (reverse proxy) -----------------------------------------------
  # The ONLY service that publishes ports. Routes by path: /api/* -> backend,
  # everything else -> frontend. Config is mounted read-only so it can change
  # without rebuilding an image. Serves HTTPS on 443 with the Cloudflare Origin
  # Certificate (mounted from ./infra/certs, which is gitignored).
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
